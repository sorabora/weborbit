<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weborbit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="icon" type="image/x-icon" href="Favicon.ico">
    <script src="commons.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-secondary py-3">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Web<span id="role-text" class="text-primary">orbit</span></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="game.html">Game</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="forum.html">Forums</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://discord.gg/zv34r6aR3">Discord</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row align-items-center g-5">
        <div class="col-lg-6 text-center text-lg-start">
          <h1 class="display-4 fw-bold">Simple rockets.<br />Built in your browser.</h1>
          <p class="lead">Weborbit is a small open source web game about launching rockets.</p>
          <div class="row row-cols-2 g-2">
            <div class="col"><a href="game.html" class="btn btn-primary btn-lg w-100">Play The Game</a></div>
            <div class="col"><a href="forum.html" class="btn btn-outline-light btn-lg w-100">Community</a></div>
            <div class="col"><a href="https://github.com/sorabora/weborbit/archive/refs/heads/main.zip" class="btn btn-secondary btn-lg w-100">Download</a></div>
            <div class="col"><a href="https://sorabora.github.io/Xopernicus" class="btn btn-outline-primary btn-lg w-100">Xopernicus</a></div>
          </div>
          <div id="forum-stats" class="row g-2 mt-3"></div>
        </div>
        <div class="col-lg-6">
          <img src="Hero.png" class="img-fluid rounded-4 d-block mx-auto" alt="Rocket launching in the Weborbit game">
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="supabase.umd.js"></script>
    <script type="module">
      import { supabase } from "./forum/forum.js";

      const [{ count: threadCount }, { count: replyCount }, { count: userCount }] = await Promise.all([
        supabase.from("posts").select("*", { count: "exact", head: true }),
        supabase.from("replies").select("*", { count: "exact", head: true }),
        supabase.from("users").select("*", { count: "exact", head: true }),
      ]);

      const stats = [
        [threadCount, "Threads"],
        [replyCount, "Replies"],
        [userCount, "Members"],
      ];
      document.getElementById("forum-stats").innerHTML = stats
        .map(
          ([count, label]) => `
            <div class="col-4">
              <div class="border rounded-3 py-2 text-center">
                <div class="fs-4 fw-semibold">${count ?? 0}</div>
                <div class="text-secondary small">${label}</div>
              </div>
            </div>
          `
        )
        .join("");
    </script>
  </body>
</html>
