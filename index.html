<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="p5.min.js"></script>
    <script src="p5.sound.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta charset="utf-8" />
  </head>
  <body>
    <main></main>
    <div id="fatalError" hidden>
      <div class="flex">
        <div class="container">
          <h1>p5.js crashed?</h1>
          <img src="Favicon.ico" width="64" height="64" />
        </div>
        <div class="container">
          <h1>:(</h1>
        </div>
      </div>
      <div class="flex">
        <div class="container">
          <pre id="errorDetails">Error Details:</pre>
        </div>
      </div>
      <div class="flex">
        <div class="container">
          <pre id="errorPhase"></pre>
        </div>
      </div>
      <div class="flex">
        <div class="container">
          <button id="clearStorage">Clear saved game data and reload</button>
        </div>
      </div>
    </div>
    <script>
      document.getElementById("clearStorage").addEventListener("click", () => {
        for (const key of Object.keys(localStorage)) {
          if (key.startsWith("weborbit-")) {
            localStorage.removeItem(key);
          }
        }
        location.reload();
      });
    </script>
    <script src="js/boot/script-loader.js"></script>
  </body>
</html>
