<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logic Gate Puzzles</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2028;
    --panel2: #232833;
    --border: #313846;
    --text: #dfe3ea;
    --dim: #8a92a3;
    --accent: #4488ff;
    --good: #3ecf6b;
    --bad: #e0524f;
    --lit: #ffcc33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  header {
    padding: 28px 20px 18px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 6px; font-size: 1.7rem; }
  header p { margin: 0 auto; color: var(--dim); max-width: 560px; }
  #progress-wrap {
    max-width: 640px;
    margin: 14px auto 0;
    padding: 0 20px;
  }
  #progress-bar {
    height: 8px;
    background: var(--panel2);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }
  #progress-label {
    text-align: center;
    color: var(--dim);
    font-size: .82rem;
    margin-top: 4px;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  .tier-heading {
    margin: 40px 0 4px;
    font-size: .78rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .tier-heading:first-child { margin-top: 0; }
  .concept-box {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 14px 16px;
    margin: 10px 0 18px;
    font-size: .92rem;
  }
  .concept-box .concept-name {
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .puzzle {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .puzzle.solved { border-color: var(--good); }
  .puzzle-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .puzzle-num { color: var(--dim); font-size: .8rem; }
  .puzzle-title { font-weight: 600; font-size: 1rem; }
  .solved-tag { font-size: .76rem; color: var(--good); display: none; }
  .puzzle.solved .solved-tag { display: inline; }
  .puzzle-body p { margin: 5px 0; }
  .parts-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0;
  }
  .part-chip {
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 9px;
    font-size: .78rem;
    background: var(--panel2);
    color: var(--dim);
  }
  .goal { margin-top: 6px; font-size: .92rem; }
  .goal b { color: var(--text); }
  .open-btn {
    margin-top: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 5px;
    padding: 6px 14px;
    font-size: .85rem;
    cursor: pointer;
  }
  .builder {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .builder-hint { font-size: .78rem; color: var(--dim); margin-bottom: 8px; }
  .palette {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .palette button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 5px;
    padding: 6px 10px;
    font-size: .78rem;
    cursor: pointer;
  }
  .palette button.selected { border-color: var(--accent); background: rgba(68,136,255,.18); color: var(--accent); }
  .palette button.eraser { color: var(--bad); }
  .grid-wrap { display: flex; justify-content: center; margin-bottom: 10px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 52px);
    grid-template-rows: repeat(5, 52px);
    gap: 4px;
  }
  .cell {
    border: 1px solid var(--border);
    background: var(--panel2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .58rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.1;
    cursor: pointer;
    color: var(--dim);
    user-select: none;
    padding: 2px;
  }
  .cell.filled { color: var(--text); }
  .cell.lit { background: rgba(255,204,51,.25); border-color: var(--lit); color: #3a2f08; }
  .builder-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.action {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 5px;
    padding: 7px 14px;
    font-size: .85rem;
    cursor: pointer;
  }
  button.action.primary { background: var(--accent); border-color: var(--accent); color: #08101f; font-weight: 600; }
  .feedback { margin-top: 8px; font-size: .85rem; min-height: 1.2em; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  footer {
    text-align: center;
    color: var(--dim);
    font-size: .8rem;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Logic Gate Puzzles</h1>
  <p>40 build challenges for the rocket game's logic parts. Open a puzzle's builder, place parts on the grid, wire them by adjacency (top/left/bottom/right), and hit Check.</p>
  <div id="progress-wrap">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">0 / 40 solved</div>
  </div>
</header>

<main id="main"></main>

<footer>Progress and circuits are kept in this browser tab only.</footer>

<script>
const STORAGE_KEY = "lgp-solved-v3";
let solved = {};
try {
  solved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch (e) {
  solved = {};
}

function saveSolved() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(solved));
  } catch (e) {}
}

function updateProgress() {
  const total = puzzles.length;
  const done = Object.keys(solved).filter(k => solved[k]).length;
  document.getElementById("progress-fill").style.width = (done / total * 100) + "%";
  document.getElementById("progress-label").textContent = done + " / " + total + " solved";
}

const PART_ABBR = {
  "True Block": "TRUE",
  "False Block": "FALSE",
  "AND Gate": "AND",
  "OR Gate": "OR",
  "NOT Gate": "NOT",
  "XOR Gate": "XOR",
  "NAND Gate": "NAND",
  "NOR Gate": "NOR",
  "XNOR Gate": "XNOR",
  "Wire": "WIRE",
  "Omni Wire": "OMNI",
  "Pixel": "MEM",
  "Clock": "CLK",
  "Signal Lamp": "LAMP"
};

function computeOutput(type, n, cellState) {
  switch (type) {
    case "True Block": return true;
    case "False Block": return false;
    case "AND Gate": return n.left && n.right;
    case "OR Gate": return n.left || n.right;
    case "NOT Gate": return !n.left;
    case "XOR Gate": return n.left !== n.right;
    case "NAND Gate": return !(n.left && n.right);
    case "NOR Gate": return !(n.left || n.right);
    case "XNOR Gate": return n.left === n.right;
    case "Wire": return n.left || n.right;
    case "Omni Wire": return n.top || n.left || n.bottom || n.right;
    case "Signal Lamp": return n.top || n.left || n.bottom || n.right;
    case "Pixel": {
      const write = n.top && n.left;
      if (write) cellState.mem = n.bottom;
      return !!cellState.mem;
    }
    case "Clock": {
      cellState.timer -= 200;
      if (cellState.timer <= 0) {
        cellState.pulse = !cellState.pulse;
        cellState.timer = 500;
      }
      return cellState.pulse;
    }
    default: return false;
  }
}

function makeBuilder(puzzle) {
  const SIZE = 5;
  const grid = [];
  const states = [];
  const outputs = [];
  for (let r = 0; r < SIZE; r++) {
    grid.push(new Array(SIZE).fill(null));
    states.push(new Array(SIZE).fill(null).map(() => ({ mem: false, pulse: false, timer: 500 })));
    outputs.push(new Array(SIZE).fill(false));
  }

  function neighborsAt(r, c) {
    const get = (rr, cc) => (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE) ? outputs[rr][cc] : false;
    return { top: get(r - 1, c), bottom: get(r + 1, c), left: get(r, c - 1), right: get(r, c + 1) };
  }

  function tick() {
    const next = [];
    for (let r = 0; r < SIZE; r++) {
      next.push(new Array(SIZE).fill(false));
      for (let c = 0; c < SIZE; c++) {
        const type = grid[r][c];
        if (!type) continue;
        next[r][c] = computeOutput(type, neighborsAt(r, c), states[r][c]);
      }
    }
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        outputs[r][c] = next[r][c];
      }
    }
  }

  function collect() {
    const lamps = [];
    const pixels = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === "Signal Lamp") lamps.push(outputs[r][c]);
        if (grid[r][c] === "Pixel") pixels.push(outputs[r][c]);
      }
    }
    return { lamps, pixels };
  }

  return { SIZE, grid, states, outputs, tick, collect };
}

function renderBuilder(puzzle, container) {
  const b = makeBuilder(puzzle);
  let selectedTool = null;
  let history = [];
  let intervalId = null;

  const hint = document.createElement("div");
  hint.className = "builder-hint";
  hint.textContent = "Gates read In1 from the left, In2 from the right (NOT reads left only). Pixel reads Data from the bottom, Write from top AND left. Lamps/pixels are read left-to-right, top-to-bottom.";
  container.appendChild(hint);

  const palette = document.createElement("div");
  palette.className = "palette";
  const uniqueParts = [...new Set(puzzle.parts)];
  const toolButtons = {};

  function selectTool(tool, btn) {
    selectedTool = tool;
    Object.values(toolButtons).forEach(b2 => b2.classList.remove("selected"));
    btn.classList.add("selected");
  }

  uniqueParts.forEach(p => {
    const btn = document.createElement("button");
    btn.textContent = PART_ABBR[p] || p;
    btn.onclick = () => selectTool(p, btn);
    palette.appendChild(btn);
    toolButtons[p] = btn;
  });
  const eraseBtn = document.createElement("button");
  eraseBtn.textContent = "Erase";
  eraseBtn.className = "eraser";
  eraseBtn.onclick = () => selectTool("__erase__", eraseBtn);
  palette.appendChild(eraseBtn);
  toolButtons["__erase__"] = eraseBtn;
  container.appendChild(palette);

  const gridWrap = document.createElement("div");
  gridWrap.className = "grid-wrap";
  const gridEl = document.createElement("div");
  gridEl.className = "grid";
  const cellEls = [];
  for (let r = 0; r < b.SIZE; r++) {
    cellEls.push([]);
    for (let c = 0; c < b.SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.onclick = () => {
        if (!selectedTool) return;
        if (selectedTool === "__erase__") {
          b.grid[r][c] = null;
        } else {
          b.grid[r][c] = selectedTool;
          b.states[r][c] = { mem: false, pulse: false, timer: 500 };
        }
        redrawCell(r, c);
      };
      gridEl.appendChild(cell);
      cellEls[r].push(cell);
    }
  }
  gridWrap.appendChild(gridEl);
  container.appendChild(gridWrap);

  function redrawCell(r, c) {
    const type = b.grid[r][c];
    const el = cellEls[r][c];
    const lit = !!b.outputs[r][c];
    el.textContent = type ? (PART_ABBR[type] || type) : "";
    el.classList.toggle("filled", !!type);
    el.classList.toggle("lit", !!type && lit);
  }

  function redrawAll() {
    for (let r = 0; r < b.SIZE; r++) {
      for (let c = 0; c < b.SIZE; c++) redrawCell(r, c);
    }
  }

  const actions = document.createElement("div");
  actions.className = "builder-actions";

  const checkBtn = document.createElement("button");
  checkBtn.className = "action primary";
  checkBtn.textContent = puzzle.checkType === "freeform" ? "Mark solved" : "Check";
  actions.appendChild(checkBtn);

  const resetBtn = document.createElement("button");
  resetBtn.className = "action";
  resetBtn.textContent = "Clear grid";
  resetBtn.onclick = () => {
    for (let r = 0; r < b.SIZE; r++) {
      for (let c = 0; c < b.SIZE; c++) {
        b.grid[r][c] = null;
        b.outputs[r][c] = false;
      }
    }
    history = [];
    redrawAll();
  };
  actions.appendChild(resetBtn);
  container.appendChild(actions);

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  container.appendChild(feedback);

  function setFeedback(ok, msg) {
    feedback.textContent = msg;
    feedback.className = "feedback " + (ok ? "good" : "bad");
  }

  function evaluate() {
    if (puzzle.checkType === "freeform") return { ok: true, msg: "Marked solved." };
    const ctx = b.collect();
    if (ctx.lamps.length < (puzzle.needLamps || 0)) {
      return { ok: false, msg: "Place at least " + puzzle.needLamps + " Signal Lamp(s) first." };
    }
    if (ctx.pixels.length < (puzzle.needPixels || 0)) {
      return { ok: false, msg: "Place at least " + puzzle.needPixels + " Pixel(s) first." };
    }
    if (puzzle.checkType === "temporal") {
      if (history.length < 8) {
        return { ok: false, msg: "Give it a couple more seconds to run, then check again." };
      }
      const ok = puzzle.predicate(history);
      return { ok, msg: ok ? "Correct." : "Not there yet — keep watching or rewire." };
    }
    const ok = puzzle.predicate(ctx);
    return { ok, msg: ok ? "Correct." : "Not there yet." };
  }

  checkBtn.onclick = () => {
    const result = evaluate();
    setFeedback(result.ok, result.msg);
    if (result.ok) {
      solved[puzzle.id] = true;
      saveSolved();
      puzzle._card.classList.add("solved");
      updateProgress();
    }
  };

  intervalId = setInterval(() => {
    b.tick();
    redrawAll();
    history.push(b.collect());
    if (history.length > 20) history.shift();
  }, 200);

  return () => clearInterval(intervalId);
}

function buildConceptBox(concept) {
  const box = document.createElement("div");
  box.className = "concept-box";
  const name = document.createElement("div");
  name.className = "concept-name";
  name.textContent = concept.name;
  const body = document.createElement("div");
  body.textContent = concept.body;
  box.appendChild(name);
  box.appendChild(body);
  return box;
}

function renderPuzzle(puzzle) {
  const card = document.createElement("div");
  card.className = "puzzle";
  if (solved[puzzle.id]) card.classList.add("solved");
  puzzle._card = card;

  const head = document.createElement("div");
  head.className = "puzzle-head";
  head.innerHTML = "<span class=\"puzzle-num\">#" + puzzle.id + "</span> &nbsp; <span class=\"puzzle-title\">" + puzzle.title + "</span>";
  const tag = document.createElement("span");
  tag.className = "solved-tag";
  tag.textContent = "solved";
  head.appendChild(tag);
  card.appendChild(head);

  const partsRow = document.createElement("div");
  partsRow.className = "parts-row";
  puzzle.parts.forEach(p => {
    const chip = document.createElement("span");
    chip.className = "part-chip";
    chip.textContent = p;
    partsRow.appendChild(chip);
  });
  card.appendChild(partsRow);

  const goal = document.createElement("div");
  goal.className = "goal";
  goal.innerHTML = "<b>Goal:</b> " + puzzle.goal;
  card.appendChild(goal);

  let builderTeardown = null;
  const openBtn = document.createElement("button");
  openBtn.className = "open-btn";
  openBtn.textContent = "Open builder";
  const builderEl = document.createElement("div");
  builderEl.className = "builder";
  builderEl.hidden = true;

  openBtn.onclick = () => {
    if (builderEl.hidden) {
      builderEl.hidden = false;
      openBtn.textContent = "Close builder";
      builderTeardown = renderBuilder(puzzle, builderEl);
    } else {
      builderEl.hidden = true;
      openBtn.textContent = "Open builder";
      builderEl.innerHTML = "";
      if (builderTeardown) builderTeardown();
    }
  };

  card.appendChild(openBtn);
  card.appendChild(builderEl);
  return card;
}

function renderAll() {
  const main = document.getElementById("main");
  let lastTier = null;
  puzzles.forEach(puzzle => {
    if (puzzle.tier !== lastTier) {
      const heading = document.createElement("div");
      heading.className = "tier-heading";
      heading.textContent = puzzle.tier;
      main.appendChild(heading);
      lastTier = puzzle.tier;
    }
    if (puzzle.concept) {
      main.appendChild(buildConceptBox(puzzle.concept));
    }
    main.appendChild(renderPuzzle(puzzle));
  });
  updateProgress();
}

const puzzles = [

  { id: 1, tier: "Tier 1 — Constants and lamps", title: "Turn the lamp on",
    concept: { name: "True Block / False Block / Signal Lamp",
      body: "A True Block always outputs true, a False Block always outputs false — they're fixed signal sources, not switches. A Signal Lamp just displays whatever signal touches it: lit if true, dark if false." },
    parts: ["True Block", "Signal Lamp"],
    goal: "Try to make the lamp light up using just a True Block.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 2, tier: "Tier 1 — Constants and lamps", title: "Turn the lamp off",
    parts: ["False Block", "Signal Lamp"],
    goal: "Try to make the lamp go dark using just a False Block.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 3, tier: "Tier 2 — AND", title: "Both or nothing",
    concept: { name: "AND Gate",
      body: "An AND Gate has two input sides (In1, In2) and only outputs true if both the parts touching it are true. Wire its output into a Signal Lamp to see the result." },
    parts: ["True Block", "True Block", "AND Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an AND Gate using two True Blocks.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 4, tier: "Tier 2 — AND", title: "One is not enough",
    parts: ["True Block", "False Block", "AND Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an AND Gate fed by one True Block and one False Block.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 5, tier: "Tier 3 — OR", title: "Either will do",
    concept: { name: "OR Gate",
      body: "An OR Gate outputs true if at least one of its two inputs is true. Only both-false gives false." },
    parts: ["True Block", "False Block", "OR Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an OR Gate fed by one True Block and one False Block.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 6, tier: "Tier 3 — OR", title: "Both off",
    parts: ["False Block", "False Block", "OR Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an OR Gate fed by two False Blocks.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 7, tier: "Tier 4 — NOT", title: "Say the opposite",
    concept: { name: "NOT Gate",
      body: "A NOT Gate takes a single input and flips it — the only gate here with one input side instead of two." },
    parts: ["True Block", "NOT Gate", "Signal Lamp"],
    goal: "Try to light a lamp by running a True Block through a NOT Gate.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 8, tier: "Tier 4 — NOT", title: "Double negative",
    parts: ["False Block", "NOT Gate", "NOT Gate", "Signal Lamp"],
    goal: "Try to light a lamp by running a False Block through two NOT Gates in a row.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 9, tier: "Tier 5 — XOR", title: "Only when they differ",
    concept: { name: "XOR Gate",
      body: "XOR outputs true only when its two inputs disagree. Same and same gives false, no matter which way." },
    parts: ["True Block", "False Block", "XOR Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an XOR Gate fed by one True Block and one False Block.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 10, tier: "Tier 5 — XOR", title: "Agreement kills it",
    parts: ["True Block", "True Block", "XOR Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an XOR Gate fed by two True Blocks.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 11, tier: "Tier 6 — The inverted three", title: "Not both of them",
    concept: { name: "NAND / NOR / XNOR",
      body: "These are AND, OR, and XOR with a NOT already baked in. NAND is \"not (A and B)\", NOR is \"not (A or B)\", XNOR is \"not (A xor B)\" — true when the inputs match." },
    parts: ["True Block", "True Block", "NAND Gate", "AND Gate", "Signal Lamp"],
    goal: "Try to light a lamp through a NAND Gate fed by two True Blocks, then swap in a plain AND Gate with the same wiring and compare.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },

  { id: 12, tier: "Tier 6 — The inverted three", title: "Neither one",
    parts: ["False Block", "False Block", "NOR Gate", "Signal Lamp"],
    goal: "Try to light a lamp through a NOR Gate fed by two False Blocks.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 13, tier: "Tier 6 — The inverted three", title: "Matching inputs",
    parts: ["False Block", "False Block", "XNOR Gate", "Signal Lamp"],
    goal: "Try to light a lamp through an XNOR Gate fed by two False Blocks.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 14, tier: "Tier 7 — Wire", title: "Carry it further",
    concept: { name: "Wire",
      body: "A Wire doesn't compute anything — it just relays whatever signal is fed into it, unchanged. Use it to route a signal across a rocket without going through a gate." },
    parts: ["True Block", "Wire", "Wire", "Signal Lamp"],
    goal: "Try to light a lamp by routing a True Block's signal through two Wires in a row.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === true },

  { id: 15, tier: "Tier 7 — Wire", title: "A wire changes nothing",
    parts: ["False Block", "Wire", "Signal Lamp"],
    goal: "Try to light a lamp by routing a False Block's signal through a single Wire.",
    checkType: "instant", needLamps: 1, predicate: ctx => ctx.lamps[0] === false },
