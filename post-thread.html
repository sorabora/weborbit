<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forums - Weborbit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script src="commons.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-secondary py-3">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Web<span class="text-primary">orbit</span></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul id="navbar-items" class="navbar-nav ms-auto">
            <li class="nav-item d-flex align-items-center">
              <span id="role-text" class="badge bg-danger me-2"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="game.html">Game</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="forum.html">Forums</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://discord.gg/zv34r6aR3">Discord</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pt-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="mb-0">Forums</h1>
      </div>

      <a href="login.html" class="btn btn-lg btn-success px-4">Login</a>
      <a href="signup.html" class="btn btn-lg btn-primary px-4">Signup</a>
      <hr>

      <div class="input-group input-group-lg mb-3 mt-3">
        <span class="input-group-text" id="basic-addon1">📛</span>
        <input id="post-title" type="email" class="form-control" placeholder="My Awesome Thread" aria-label="Email" aria-describedby="basic-addon1">
      </div>
      <div class="input-group input-group-lg mb-3 mt-3">
        <span class="input-group-text" id="basic-addon1">🏷️</span>
        <button id="category-btn" class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Select Category
        </button>
        <ul id="category-menu" class="dropdown-menu">
          <li><button class="dropdown-item" type="button">Announcements</button></li>
          <li><button class="dropdown-item" type="button">Modding</button></li>
          <li><button class="dropdown-item" type="button">Questions</button></li>
          <li><button class="dropdown-item" type="button">Suggestions</button></li>
          <li><button class="dropdown-item" type="button">Bug Reports</button></li>
          <li><button class="dropdown-item" type="button">Weborbit Rockets</button></li>
          <li><button class="dropdown-item" type="button">Fanart</button></li>
          <li><button class="dropdown-item" type="button">Tutorials &amp; Guides</button></li>
          <li><button class="dropdown-item" type="button">Challenges</button></li>
          <li><button class="dropdown-item" type="button">Mission Reports</button></li>
          <li><button class="dropdown-item" type="button">Off-Topic</button></li>
          <li><button class="dropdown-item" type="button">Real-life Rockets</button></li>
        </ul>
      </div>
      <textarea class="form-control" id="post-content" placeholder="Your post's content..." rows="5"></textarea>
      <div class="d-grid">
        <button class="btn btn-lg btn-primary px-4 mt-3" id="post-thread">Post Thread</button>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="forum/forum.js"></script>
  </body>
</html>
