<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forums - Weborbit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script src="commons.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-secondary py-3">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Web<span class="text-primary">orbit</span></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul id="navbar-items" class="navbar-nav ms-auto">
            <li class="nav-item d-flex align-items-center">
              <span id="role-text" class="badge bg-danger me-2"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="game.html">Game</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="forum.html">Forums</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://discord.gg/zv34r6aR3">Discord</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pt-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="mb-0">Create a Forum Account</h1>
      </div>
      <a href="login.html" class="btn btn-lg btn-outline-primary px-4">Login</a>
      <div class="input-group mb-3 mt-3">
        <div class="input-group input-group-lg mb-3 mt-3">
          <span class="input-group-text" id="basic-addon1">📧</span>
          <input id="signup-email" type="email" class="form-control" placeholder="you@example.com" aria-label="Email" aria-describedby="basic-addon1">
        </div>
        <div class="input-group input-group-lg mb-3 mt-3">
          <span class="input-group-text" id="basic-addon1">@</span>
          <input id="signup-username" type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
        </div>
        <div class="input-group input-group-lg mb-3 mt-3">
          <span class="input-group-text" id="basic-addon1">🔑</span>
          <input id="signup-password" type="password" class="form-control" placeholder="Password" aria-label="Password" aria-describedby="basic-addon1">
        </div>
      </div>
      <div class="d-grid">
        <button class="btn btn-lg btn-primary" type="button" id="signup-btn">Signup</button>
      </div>
    </div>
    <script src="supabase.umd.js"></script>
    <script type="module" src="forum/forum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
