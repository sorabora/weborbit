<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout Test - Weborbit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="forum-op.css">
    <script src="commons.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-secondary py-3">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Web<span class="text-primary">orbit</span></a>
      </div>
    </nav>

    <div class="container-xxl pt-5 px-4 px-xl-5">
      <h1 class="mb-4">Layout Test: 50-deep nested replies</h1>
      <div class="row">
        <div class="col-12 col-lg-2 order-2 order-lg-1">
          <p class="text-secondary small mb-2">Participants</p>
          <div id="thread-participants" class="d-flex flex-column"></div>
        </div>
        <div class="col-12 col-lg-8 order-1 order-lg-2">
          <div id="thread"></div>
          <h1>Comments</h1>
          <div id="comments"></div>
        </div>
        <div class="col-12 col-lg-2 order-3">
          <p class="text-secondary small mb-2">Thread Stats</p>
          <div id="thread-stats" class="p-3 border bg-body-secondary rounded small"></div>
        </div>
      </div>
    </div>

    <script>
      function avatarUrl(seed, size = 24) {
        return `https://api.dicebear.com/9.x/identicon/svg?seed=${encodeURIComponent(seed ?? "unknown")}&size=${size}`;
      }
      function avatarImg(seed, size = 24, fullWidth = false) {
        const dims = fullWidth
          ? `width="100%" style="aspect-ratio: 1 / 1; background: #fff; border-radius: 4px"`
          : `width="${size}" height="${size}" style="vertical-align: -0.3em; background: #fff; border-radius: 4px"`;
        return `<img src="${avatarUrl(seed, size)}" ${dims} alt="">`;
      }

      const NEST_DEPTH = 50;
      const names = ["Astro", "Vector", "Orbiter", "Thrust", "Payload", "Delta", "Gimbal", "Apogee", "Ion", "Cryo"];
      function nameFor(i) {
        return `${names[i % names.length]}${i}`;
      }

      // OP
      $t("thread").innerHTML = `
        <h1 id="thread-title">Test Thread: How deep can this go</h1>
        <div class="jbbs-post" id="thread-body">
          <div class="jbbs-side">
            <a href="#">${avatarImg("OP-User", 48)}</a>
          </div>
          <div class="flex-grow-1">
            <p class="jbbs-meta mb-1">
              <span class="jbbs-num">1</span>
              <span class="jbbs-name"><a href="#">OP-User</a></span>
              <span>just now</span>
            </p>
            <div id="thread-content" class="jbbs-body">Testing what happens when replies nest ${NEST_DEPTH} levels deep. Scroll right and see.</div>
          </div>
        </div>
      `;

      // Build one reply chain, each replying to the last, N deep
      let html = "";
      let closing = "";
      for (let i = 0; i < NEST_DEPTH; i++) {
        const num = i + 2;
        const author = nameFor(i);
        html += `
          <div class="jbbs-post">
            <div class="jbbs-side">
              <a href="#">${avatarImg(author, 48)}</a>
            </div>
            <div class="flex-grow-1">
              <p class="jbbs-meta mb-1">
                <span class="jbbs-num">${num}</span>
                <span class="jbbs-name"><a href="#">${author}</a></span>
                <span>${num} minutes ago</span>
              </p>
              <div class="jbbs-body">Reply nested at depth ${i + 1}. Replying to ${i === 0 ? "OP-User" : nameFor(i - 1)}.</div>
              <div class="children ms-4">`;
        closing = `</div></div></div>` + closing;
      }
      $t("comments").innerHTML = html + closing;

      // Sidebar stats using the same participant set
      const participants = ["OP-User", ...Array.from({ length: NEST_DEPTH }, (_, i) => nameFor(i))];
      const uniqueParticipants = [...new Set(participants)];
      $t("thread-participants").innerHTML = `
        <div style="width: 75%">${avatarImg("OP-User", 96, true)}</div>
        <hr class="w-100 my-2">
        <div class="w-100 d-grid gap-2" style="grid-template-columns: repeat(auto-fill, minmax(36px, 1fr))">
          ${uniqueParticipants.slice(1).map(p => `<a href="#">${avatarImg(p, 36)}</a>`).join("")}
        </div>
      `;
      $t("thread-stats").innerHTML = `
        <p class="mb-1"><strong>${NEST_DEPTH}</strong> replies</p>
        <p class="mb-1"><strong>${uniqueParticipants.length}</strong> participants</p>
        <p class="mb-0 text-secondary">Last activity just now</p>
      `;

      function $t(id) {
        return document.getElementById(id);
      }
    </script>
  </body>
</html>
